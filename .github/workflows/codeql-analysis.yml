# Analyse statique de sécurité (CodeQL) de la solution « Forge Watcher ».
#
# Déclencheurs : chaque push et chaque pull request sur « main », plus un balayage
# hebdomadaire. Le balayage n'est pas redondant : une alerte peut apparaître sans que
# le code ait bougé, quand une nouvelle requête entre dans la base CodeQL.
#
# Pourquoi une compilation explicite plutôt qu'« autobuild » ?
#   La solution est au format .slnx, qui exige un SDK .NET >= 9.0.200. S'en remettre à
#   autobuild, c'est s'en remettre au SDK par défaut du runner et à sa capacité à
#   reconnaître ce format — deux choses qui peuvent changer sans prévenir. On installe
#   donc le même SDK que la CI et on compile soi-même, entre « init » et « analyze »,
#   comme l'exige « build-mode: manual ».
#
# Pourquoi Windows ? Comme pour la CI : les couches Infrastructure et Ui ne compilent
# pas ailleurs (WinForms, DPAPI, registre). Voir l'en-tête de ci.yml.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * SUN"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SOLUTION: CSharp-ForgeWatcher.slnx

jobs:
  analyse:
    name: Analyse CodeQL (C#)
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation du SDK .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Cache des paquets NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'NuGet.Config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Initialisation de CodeQL
        uses: github/codeql-action/init@v4.37.5
        with:
          languages: csharp
          build-mode: manual

      # CodeQL observe cette compilation : elle doit produire une vraie passe du
      # compilateur, sans quoi l'analyse échoue faute d'avoir vu du code source.
      - name: Compilation en Release
        run: |
          dotnet restore ${{ env.SOLUTION }}
          dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Analyse
        uses: github/codeql-action/analyze@v4.37.5
        with:
          category: "/language:csharp"
